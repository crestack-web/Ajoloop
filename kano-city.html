<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17123f">
<title>Ajoloop — Build your circle</title>
<style>
:root{
  --ink:#17123f;--ink2:#1f1856;--ink3:#0d0a2b;
  --card:#2a2272;--card2:#352c88;--card3:#3d3499;
  --line:#4a40a8;--line2:#5a50b8;
  --danfo:#ffc928;--danfo-dim:#b88a00;--gold-soft:rgba(255,201,40,.12);
  --keke:#22c177;--keke-dim:#11804d;--green-soft:rgba(34,193,119,.12);
  --hib:#ff5a6b;--hib-dim:#b02a39;--red-soft:rgba(255,90,107,.12);
  --sky:#5cc8ff;--txt:#f6f2ff;--mut:#b6add9;--mut2:#8a7eb8;
  --r:20px;--r-sm:14px;--r-lg:24px;
  --shadow:0 4px 0 rgba(0,0,0,.3);--shadow-sm:0 3px 0 rgba(0,0,0,.28);
  --nav-h:76px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0d0a2b;color:var(--txt);font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
 background-color:var(--ink);
 background-image:radial-gradient(circle at 50% 50%,rgba(255,201,40,.07) 0 9px,transparent 10px),radial-gradient(circle at 50% 50%,rgba(34,193,119,.07) 0 9px,transparent 10px);
 background-size:60px 60px;background-position:0 0,30px 30px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.muted{color:var(--mut)}.tiny{font-size:12px}.sm{font-size:13.5px}
.px{padding:0 12px}
/* HUD */
.hud{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1b1450,#17123f);padding:10px 14px 8px;
 border-bottom:6px solid;border-image:repeating-linear-gradient(90deg,#ffc928 0 16px,#14102f 16px 32px) 1}
.hud .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day{font-weight:800;font-size:15px}.day span{display:block;font-weight:600;font-size:12px;color:var(--mut)}
.cash{font-size:28px;font-weight:900;color:var(--danfo);letter-spacing:-.02em;transition:transform .2s}
.cash.pulse{transform:scale(1.12)}
.bell{position:relative;background:var(--card);border-radius:14px;width:42px;height:42px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--hib);border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 4px}
.hud .r2{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;align-items:end;margin-top:8px}
.mini{font-size:10.5px;color:var(--mut);font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:800;background:var(--card);white-space:nowrap}
.chip.t{background:#13513a;color:#7dffc4}.chip.rp{background:#5a3c10;color:#ffd978}
.hb{height:3px;background:rgba(255,255,255,.08);margin:8px -14px -8px}.hb i{display:block;height:100%;width:0;background:var(--danfo)}
/* layout */
main{padding:6px 0 10px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.card.flat{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}
.sec{margin:18px 14px 4px;font-size:19px;font-weight:900}
.sec small{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:2px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.btn{display:block;width:100%;background:var(--danfo);color:#241a00;font-weight:900;padding:13px 14px;border-radius:15px;text-align:center;box-shadow:0 4px 0 #b88a00;font-size:15px;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.red{background:var(--hib);color:#fff;box-shadow:0 4px 0 #b02a39}
.btn.green{background:var(--keke);color:#04281a;box-shadow:0 4px 0 #11804d}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:12px;display:inline-block;width:auto}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.act:disabled{opacity:.45}
.act .ic{font-size:26px;width:42px;height:42px;display:grid;place-items:center;background:rgba(0,0,0,.22);border-radius:13px;flex:none}
.act b{display:block;font-size:15px}.act small{color:var(--mut);font-size:12.5px}
.act .go{margin-left:auto;font-weight:900;color:var(--danfo)}
/* hero */
.hero .av{font-size:44px;width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,var(--keke),#0b6b3a);display:grid;place-items:center;flex:none}
.hero h2{font-size:24px}
.quote{margin:12px 0;padding:10px 12px;border-radius:14px;background:rgba(255,201,40,.12);border-left:5px solid var(--danfo);font-weight:700;font-size:13.5px}
/* gauge */
.gauge{--c:var(--keke);--v:50;width:92px;height:92px;border-radius:50%;margin:4px auto 8px;display:grid;place-items:center;
 background:conic-gradient(var(--c) calc(var(--v)*3.6deg),rgba(0,0,0,.35) 0)}
.gauge div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px;font-weight:900}
.center{text-align:center}
/* map */
.map{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;margin:12px;border-radius:24px;background:#25213f;box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 0 0 3px #3a3560}
.map:before,.map:after{content:"";position:absolute;left:10px;right:10px;border-top:3px dashed rgba(255,201,40,.45)}
.map:before{top:33.3%}.map:after{top:66.6%}
.tile{position:relative;z-index:1;aspect-ratio:1/1.02;border-radius:18px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center}
.tile .ti{font-size:30px}.tile b{font-size:11.5px;line-height:1.1}.tile small{font-size:10.5px;color:var(--mut);min-height:12px}
.tile.here{background:var(--danfo);color:#241a00}.tile.here small,.tile.here .me{color:#241a00}
.tile .me{font-style:normal;font-size:10.5px;font-weight:900;background:#241a00;color:var(--danfo)!important;border-radius:99px;padding:0 7px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tile.center{background:transparent;box-shadow:none;color:var(--danfo);font-size:22px;pointer-events:none}.tile.center b{font-size:11px;letter-spacing:.08em}
/* people */
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:11px 12px;margin:0 12px 8px;width:calc(100% - 24px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--card2)}
.person .meta{flex:1;min-width:0}.person b{font-size:15px}.person .l{font-size:12.5px;color:var(--mut)}
.score{font-size:20px;font-weight:900}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;margin:2px 4px 0 0;background:rgba(255,255,255,.1)}
/* bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);
 background:linear-gradient(180deg,#1a1448,#120d36);padding:6px 4px calc(8px + var(--safe-b));border-top:1px solid #2d2570;
 box-shadow:0 -8px 24px rgba(0,0,0,.35)}
nav button{background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--mut2);padding:8px 2px;border-radius:14px;position:relative;min-height:52px;-webkit-user-select:none;user-select:none}
nav button span{font-size:22px;line-height:1;filter:grayscale(.55) opacity(.85);transition:transform .15s,filter .15s}
nav button.on{color:var(--danfo);background:rgba(255,201,40,.08)}
nav button.on span{filter:none;transform:translateY(-2px) scale(1.1)}
nav .dot{position:absolute;top:4px;right:18%;background:var(--hib);width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px #120d36}
/* sheet */
.back{position:fixed;inset:0;background:rgba(5,3,25,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:var(--ink2);border-radius:26px 26px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out;border-top:5px solid var(--danfo)}
.sheet h2{font-size:21px}.sheet .x{float:right;background:var(--card);width:36px;height:36px;border-radius:12px;font-size:16px}
.sheet .card{margin:10px 0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
/* toasts + floats */
#toasts{position:fixed;top:112px;left:50%;transform:translateX(-50%);z-index:80;width:min(440px,94vw);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#fff;color:#1b1450;font-weight:800;font-size:14px;border-radius:14px;padding:10px 14px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:drop .3s ease-out}
.toast.warm{background:var(--keke);color:#04281a}.toast.cold,.toast.warn{background:var(--hib);color:#fff}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.float{position:fixed;z-index:90;font-weight:900;font-size:22px;pointer-events:none;animation:flo 1.5s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.float.gain{color:#7dffc4}.float.loss{color:#ff8a96}.float.trust,.float.rep{color:var(--danfo);font-size:18px;background:#14102f;border-radius:99px;padding:4px 12px;text-shadow:none}.float.trustdn{color:#fff;background:var(--hib);font-size:18px;border-radius:99px;padding:4px 12px;text-shadow:none}
@keyframes flo{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-70px)}}
.payout{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(10,6,40,.7);animation:fade .2s;pointer-events:none}
.payout div{background:var(--danfo);color:#241a00;border-radius:28px;padding:22px 34px;text-align:center;font-weight:900;box-shadow:0 8px 0 #b88a00;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.payout b{display:block;font-size:44px}.payout span{font-size:36px;letter-spacing:.2em}
@keyframes pop{from{transform:scale(.4) rotate(-6deg)}to{transform:none}}
/* misc */
.seg{display:flex;gap:6px;margin:12px;overflow:auto}.seg button{background:var(--card);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13.5px;white-space:nowrap}.seg button.on{background:var(--danfo);color:#241a00}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.opts button{background:var(--card2);border-radius:13px;padding:9px 13px;font-weight:800;font-size:14px}.opts button.on{background:var(--danfo);color:#241a00}
input[type=text],input[type=number]{width:100%;background:#120d36;border:2px solid var(--line);border-radius:14px;padding:12px;color:var(--txt);font:inherit;font-weight:700;font-size:16px}
label.l{display:block;font-weight:800;font-size:13px;color:var(--mut);margin:12px 0 4px}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}.tx:last-child{border:0}
.pos{color:#7dffc4;font-weight:900}.neg{color:#ff8a96;font-weight:900}
.pill{font-size:11.5px;font-weight:900;border-radius:99px;padding:2px 9px}.pill.ok{background:#13513a;color:#7dffc4}.pill.no{background:#5a1a24;color:#ff9aa5}.pill.wait{background:#44409a;color:#dcd8ff}
.note{padding:10px 12px;border-radius:14px;background:var(--card);margin:0 12px 8px;font-size:14px;border-left:5px solid var(--sky)}
.note.bad{border-color:var(--hib)}.note.good{border-color:var(--keke)}.note.ajo{border-color:var(--danfo)}
.warnbox{margin:12px;padding:12px 14px;border-radius:16px;background:#5a1a24;font-weight:700;font-size:14px}
.ev .big{font-size:54px;text-align:center}
/* title */
.title{min-height:100dvh;padding:24px 18px;display:flex;flex-direction:column;justify-content:center}
.road{position:relative;height:56px;overflow:hidden;border-bottom:4px dashed rgba(255,201,40,.5);margin-bottom:18px}
.road span{position:absolute;bottom:2px;font-size:38px;animation:drive 9s linear infinite}.road span:nth-child(2){animation-duration:13s;animation-delay:-5s;font-size:32px}
@keyframes drive{from{left:-60px}to{left:105%}}
.title h1{font-size:46px;line-height:1;font-weight:900;color:var(--danfo)}
.title p{font-weight:700;color:var(--mut);margin:10px 0 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* groups */
.note.grp{border-color:#b388ff}
.msg{background:var(--card2);border-radius:14px;padding:9px 12px;margin:0 0 8px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.msg.reply{margin-left:22px;background:var(--card)}.msg.ann{border-left:5px solid var(--danfo)}
.msg .by{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:2px}
.mact{display:flex;gap:6px;margin-top:6px}.mact button{background:rgba(255,255,255,.08);border-radius:9px;padding:3px 9px;font-size:12px;font-weight:800;color:var(--mut)}
.composer{position:sticky;bottom:-8px;background:var(--ink2);padding:8px 0 4px}
.sheet .person{margin:0 0 8px;width:100%}

/* —— Design system extensions (Phase 1–2) —— */
.loc-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--txt)}
.loc-chip .dot-live{width:8px;height:8px;border-radius:50%;background:var(--keke);box-shadow:0 0 0 3px rgba(34,193,119,.25)}
.cash-label{display:block;font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.cash.sm{font-size:22px}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-20px;top:-20px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,40,.15),transparent 70%);pointer-events:none}
.hero .av{box-shadow:0 4px 0 rgba(0,0,0,.25)}
.stat-tap{cursor:pointer;border-radius:12px;padding:4px;margin:-4px;transition:background .15s}
.stat-tap:active{background:rgba(255,255,255,.06)}
.next-act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,var(--card2),var(--card3));border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid rgba(255,201,40,.2)}
.next-act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.next-act .ic{font-size:28px;width:48px;height:48px;display:grid;place-items:center;background:var(--gold-soft);border-radius:14px;flex:none}
.next-act b{display:block;font-size:15.5px}
.next-act small{color:var(--mut);font-size:12.5px}
.next-act .go{margin-left:auto;font-weight:900;color:var(--danfo);font-size:18px}
.section-label{margin:16px 14px 6px;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.empty{padding:20px 16px;text-align:center;color:var(--mut);font-size:14px;font-weight:600}
.empty .big{font-size:36px;margin-bottom:8px}
.money-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.money-row:last-child{border:0}
.money-row .label{font-size:13.5px;color:var(--mut);font-weight:700}
.money-row .val{font-size:15px;font-weight:900}
.money-row .val.gold{color:var(--danfo)}
.badge-game{font-size:10px;font-weight:900;background:var(--gold-soft);color:var(--danfo);border-radius:99px;padding:2px 8px;letter-spacing:.03em}
.badge-ajo{font-size:10px;font-weight:900;background:var(--green-soft);color:#7dffc4;border-radius:99px;padding:2px 8px}
.trust-card{text-align:center;padding:14px 10px}
.trust-card .why{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.35;font-weight:600}
.brand-mark{font-size:13px;font-weight:900;color:var(--danfo);letter-spacing:.04em}
.hud .place{font-size:12px;font-weight:800;color:var(--mut);margin-top:2px}
.btn.dev{font-size:12.5px;padding:10px 12px;opacity:.85}
.safe-pad{padding-bottom:calc(var(--nav-h) + var(--safe-b))}

/* —— Town Phase 3 —— */
.place-hero{display:flex;gap:14px;align-items:flex-start}
.place-hero .ph-ic{font-size:44px;width:64px;height:64px;border-radius:18px;background:var(--card2);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.place-hero h2{font-size:22px}
.place-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.place-tag{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.08);color:var(--mut)}
.place-tag.hot{background:var(--gold-soft);color:var(--danfo)}
.place-tag.people{background:var(--green-soft);color:#7dffc4}
.travel-hint{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22);font-size:12.5px;font-weight:700;color:var(--mut);line-height:1.4}
.act-group{margin:4px 12px 12px}
.act-group .ag-label{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px 2px}
.act.primary{background:linear-gradient(135deg,var(--card2),#4a3d9a);border:1px solid rgba(255,201,40,.25)}
.act.primary .go{color:var(--danfo)}
.act .cost{display:block;font-size:11px;color:var(--danfo);font-weight:800;margin-top:2px}
.map-wrap{margin:12px;border-radius:24px;background:#25213f;box-shadow:var(--shadow),inset 0 0 0 3px #3a3560;overflow:hidden}
.map-wrap .map{margin:0;box-shadow:none;background:transparent}
.map-legend{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:11.5px;font-weight:700;color:var(--mut);border-top:1px solid rgba(255,255,255,.06)}
.tile small.busy{color:#7dffc4;font-weight:800}
.dir-list{margin:0 12px 12px}
.dir-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.dir-item:active{transform:translateY(2px)}
.dir-item.here{background:var(--danfo);color:#241a00;box-shadow:0 4px 0 var(--danfo-dim)}
.dir-item.here .muted,.dir-item.here small{color:#5a4800!important}
.dir-item .di-ic{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:rgba(0,0,0,.2);border-radius:14px;flex:none}
.dir-item.here .di-ic{background:rgba(0,0,0,.12)}
.dir-item .go{margin-left:auto;font-weight:900;color:var(--danfo)}
.dir-item.here .go{color:#241a00}
.town-tabs{display:flex;gap:6px;margin:0 12px 8px;overflow:auto}
.town-tabs button{background:var(--card);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;white-space:nowrap;color:var(--mut)}
.town-tabs button.on{background:var(--danfo);color:#241a00}

/* —— People & Groups Phase 4–5 —— */
.people-seg{display:flex;gap:6px;margin:8px 12px;overflow:auto}
.people-seg button{background:var(--card);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;white-space:nowrap;color:var(--mut)}
.people-seg button.on{background:var(--danfo);color:#241a00}
.rel-pill{font-size:11px;font-weight:900;border-radius:99px;padding:2px 8px}

<script>
//#ENGINE-START
/* ============ KANO CITY ENGINE ============
   All game rules live here, away from the UI. State shape mirrors the planned
   Supabase tables (players, npcs, relationships, transactions, jobs, businesses,
   ajos, ajo_members, ajo_contributions, ajo_payouts, events, notifications,
   reputation_history, trust_history) so each slice can move server-side later. */
const KEY='kano-life-v1';
const WD=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>'₦'+Math.round(Math.abs(n)).toLocaleString('en-US');
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const AJO_BLOCK=7, RENT=3000, LIVING=300, SHOP_COST=15000, UNIT_COST=500, UNIT_PRICE=700;

const LOCS={
 home:{n:'Home',ic:'🏠',d:'Your room in the compound. Quiet, and the ceiling fan mostly works.'},
 market:{n:'Kasuwa Market',ic:'🛒',d:'Stalls, shouting, sacks of rice. Everyone is selling something.'},
 restaurant:{n:'Mama Put Kitchen',ic:'🍲',d:'Jollof, tuwo and gist. The best place to learn who is who.'},
 park:{n:'Keke Park',ic:'🛺',d:'Keke, danfo and drivers who know every shortcut in town.'},
 work:{n:'Workplace',ic:'💼',d:'Jobs on the noticeboard. Show up, work hard, get paid.'},
 bank:{n:'Arewa Bank',ic:'🏦',d:'Cold air-conditioning and a long queue. A safe place for savings.'},
 social:{n:'Suya Spot',ic:'🔥',d:'Suya smoke, loud music, louder opinions.'},
 ajo:{n:'Ajo Center',ic:'🤝',d:'Where savings circles form and trust gets tested.'}
};
const JOBS=[
 {id:'shop',n:'Shop Assistant',ic:'🏪',pay:5000,en:20,d:'Steady work at Mallam Haruna Stores.'},
 {id:'rider',n:'Delivery Rider',ic:'🏍️',pay:8000,en:30,d:'Best pay, hardest on the body.'},
 {id:'sales',n:'Salesperson',ic:'👔',pay:6000,en:20,d:'Talk to customers, close the deal.'}
];
const NP0=[
 {id:'musa',n:'Musa',em:'🧔🏾',occ:'Provisions trader',tags:['trustworthy','ambitious'],w:55,rep:60,tr:78,rel:34,spots:['market','restaurant','social'],bio:'Runs a provisions stall. Always has a plan and a calculator.'},
 {id:'aisha',n:'Aisha',em:'👩🏾',occ:'Tailor',tags:['generous','social'],w:45,rep:62,tr:85,rel:30,spots:['market','social','social'],bio:'Sews the best Ankara in the street. Feeds everyone.'},
 {id:'yusuf',n:'Yusuf',em:'🧑🏾',occ:'Keke rider',tags:['trustworthy','introverted'],w:35,rep:50,tr:90,rel:30,spots:['park','restaurant','park'],bio:'Quiet, punctual, never short with the change.'},
 {id:'fatima',n:'Fatima',em:'👩🏾‍🍳',occ:'Caterer',tags:['generous','social'],w:40,rep:58,tr:80,rel:30,spots:['restaurant','restaurant','social'],bio:'Cooks for weddings and knows every family secret.'},
 {id:'ibrahim',n:'Ibrahim',em:'👨🏾‍💼',occ:'Bank clerk',tags:['wealthy','introverted'],w:72,rep:66,tr:75,rel:28,spots:['bank','restaurant','ajo'],bio:'Careful with money, careful with words.'},
 {id:'maryam',n:'Maryam',em:'👩🏾‍🏫',occ:'Teacher',tags:['trustworthy','poor'],w:38,rep:64,tr:88,rel:30,spots:['ajo','restaurant','social'],bio:'Teaches primary school and runs a tight Ajo.'},
 {id:'sani',n:'Sani',em:'🧑🏾‍🔧',occ:'Phone repairer',tags:['unreliable','opportunistic'],w:30,rep:38,tr:28,rel:30,spots:['market','social','social'],bio:'Fast hands, slow promises.'},
 {id:'hauwa',n:'Hauwa',em:'👩🏾‍🌾',occ:'Fruit seller',tags:['poor','trustworthy'],w:22,rep:48,tr:72,rel:32,spots:['market','market','ajo'],bio:'Up before the sun. Counts every naira twice.'},
 {id:'abdullahi',n:'Abdullahi',em:'👷🏾',occ:'Contractor',tags:['wealthy','ambitious','opportunistic'],w:82,rep:72,tr:45,rel:26,spots:['work','bank','social'],bio:'Big projects, bigger talk. Pays when it suits him.'},
 {id:'zainab',n:'Zainab',em:'👩🏾‍⚕️',occ:'Nurse',tags:['trustworthy','introverted'],w:42,rep:60,tr:84,rel:30,spots:['ajo','restaurant','ajo'],bio:'Calm in every emergency. Rarely smiles, always shows up.'},
 {id:'bashir',n:'Bashir',em:'🧑🏾‍✈️',occ:'Danfo driver',tags:['social','unreliable'],w:44,rep:52,tr:48,rel:30,spots:['park','park','social'],bio:'Loud horn, loud laugh, loose with time.'},
 {id:'halima',n:'Halima',em:'👩🏾‍💼',occ:'Shop owner',tags:['wealthy','trustworthy'],w:78,rep:74,tr:70,rel:28,spots:['work','market','ajo'],bio:'Owns three shops. Everyone calls her Alhaja.'},
 {id:'garba',n:'Garba',em:'💂🏾',occ:'Security guard',tags:['poor','trustworthy','introverted'],w:22,rep:46,tr:80,rel:30,spots:['work','park','ajo'],bio:'Guards the gate and keeps every secret.'},
 {id:'rukayya',n:'Rukayya',em:'💇🏾‍♀️',occ:'Hairdresser',tags:['social','opportunistic'],w:46,rep:56,tr:50,rel:30,spots:['social','market','social'],bio:'Salon gist travels faster than the news.'},
 {id:'dauda',n:'Dauda',em:'🕴🏾',occ:'Money lender',tags:['wealthy','opportunistic'],w:64,rep:44,tr:32,rel:25,spots:['bank','social','social'],bio:'Smiles a lot. Always remembers what you owe.'}
];
const LINES={
 trustworthy:["Wallahi, a promise is a promise. That is how I run my business.","If you say you will come, come. People remember."],
 ambitious:["I am saving for a second shop. Small small, we rise.","Who you know matters more than what you have."],
 generous:["Abeg, eat something! You look tired.","If you need help, ask. We no dey leave people."],
 unreliable:["I will pay you back soon, soon... you know how it is.","Sharp sharp, I will come tomorrow. Or next week."],
 opportunistic:["I know a guy who knows a guy. There is money in it.","Everything has a price, my friend."],
 social:["Have you heard what happened at the junction? Come, let me tell you.","Na so! Everybody dey talk about you small small."],
 introverted:["...Good morning. I do not talk much, but I listen.","Quiet people see the most."],
 poor:["Life is hard but we dey push. One day at a time.","If I get small capital, I would change everything."],
 wealthy:["Money is good, but a good name opens bigger doors.","I only do business with people I trust."]
};

/* Traditional Ajo: creator takes round 1; later order by stone roll; platform fee on pot 1 only */
const AJO_FEE_PCT=0.08;
const STONES=[
 {id:'s1',ic:'🔴',n:'Red'},{id:'s2',ic:'🟠',n:'Orange'},{id:'s3',ic:'🟡',n:'Gold'},
 {id:'s4',ic:'🟢',n:'Green'},{id:'s5',ic:'🔵',n:'Blue'},{id:'s6',ic:'🟣',n:'Purple'},
 {id:'s7',ic:'⚫',n:'Black'},{id:'s8',ic:'⚪',n:'White'},{id:'s9',ic:'🟤',n:'Brown'},
 {id:'s10',ic:'💠',n:'Crystal'},{id:'s11',ic:'⭐',n:'Star'},{id:'s12',ic:'🪨',n:'River'}
];

const SEED=()=>[
 {id:'a1',name:'Kasuwa Kings',host:'musa',size:5,amt:5000,freq:7,members:['musa','aisha','yusuf','fatima']},
 {id:'a2',name:"Alhaja's Circle",host:'halima',size:4,amt:10000,freq:7,members:['halima','ibrahim','zainab']},
 {id:'a3',name:'Teachers & Traders',host:'maryam',size:4,amt:2000,freq:3,members:['maryam','hauwa','garba']}
].map(a=>({...a,status:'open',startDay:null,cycle:0,order:[],prio:[],req:null,nom:null,contribs:[],payouts:[],invited:false,inv:{},mode:'traditional',feePct:AJO_FEE_PCT,stones:{},rolled:false,feeTaken:0,vis:'public',joinReqs:[],chat:[],activity:[]}));

let G=null; const FX=[];
const fx=(t,k='say')=>FX.push({t,k});
const no=m=>{fx(m,'warn');return false};
const npc=id=>G.npcs.find(x=>x.id===id);
const nm=id=>id==='player'?'You':npc(id).n;
const ajoOf=id=>G.ajos.find(a=>a.id===id);
const metNpcs=m=>G.npcs.filter(n=>n.met&&n.rel>=m);
const period=()=>G.hour<12?0:G.hour<17?1:2;
const npcLoc=n=>{const p=period();return hash(n.id+G.day+p)%5===0?n.spots[(p+1)%3]:n.spots[p]};
const here=()=>G.npcs.filter(n=>npcLoc(n)===G.p.loc);
const canTime=h=>G.hour+h<=22;
const LATE="It's too late — go home and sleep.";
const netWorth=()=>G.p.cash+G.p.savings+(G.biz?Math.round(G.biz.stock*G.biz.avg):0);
const blocked=()=>G.p.blockedUntil>G.day;
const myAjos=()=>G.ajos.filter(a=>a.members.includes('player')&&a.status!=='done');

function note(txt,kind='info'){G.notes.unshift({id:G.nid++,day:G.day,txt,kind,read:false});if(G.notes.length>80)G.notes.length=80}
function miles(k,t){if(!G.mile[k])G.mile[k]={day:G.day,txt:t}}
function ledger(amount,label,cat){G.p.cash+=amount;G.tx.unshift({id:G.nid++,day:G.day,amount,label,cat,bal:G.p.cash});if(G.tx.length>250)G.tx.length=250;fx((amount>0?'+':'−')+fmt(amount),amount>0?'gain':'loss')}
const earn=(a,l,c)=>ledger(a,l,c);
function spend(a,l,c){if(G.p.cash<a)return no('Not enough cash — you need '+fmt(a));ledger(-a,l,c);return true}
function addTrust(d,why){const p=G.p,o=p.trust;p.trust=clamp(o+d);const r=Math.round(p.trust-o);if(!r)return;G.th.unshift({day:G.day,d:r,v:Math.round(p.trust),why});if(G.th.length>60)G.th.length=60;fx('TRUST '+(r>0?'↑ +':'↓ ')+r,r>0?'trust':'trustdn');if(r<=-10)fx('People are beginning to question your reliability.','warn')}
function addRep(d,why){const p=G.p,o=p.rep;p.rep=clamp(o+d);const r=Math.round(p.rep-o);if(!r)return;G.rh.unshift({day:G.day,d:r,v:Math.round(p.rep),why});if(G.rh.length>60)G.rh.length=60;fx('REPUTATION '+(r>0?'↑ +':'↓ ')+r,r>0?'rep':'trustdn');if(r>0&&r>=3)note('Your reputation increased: '+why+'.','good')}
function rel(id,d,why){const n=npc(id),o=n.rel;n.rel=clamp(o+d);const r=Math.round(n.rel-o);if(r){n.hist.unshift({day:G.day,d:r,why});if(n.hist.length>20)n.hist.length=20}
 if(d>0&&n.met){if((o<35&&n.rel>=35)||(o<60&&n.rel>=60)||(o<80&&n.rel>=80)){fx("You're becoming closer to "+n.n+".",'warm');if(n.rel>=60)note(n.n+' thinks highly of you.','good')}}
 else if(d<0&&r<0&&n.met)fx(n.n+' thinks less of you.','cold');
 if(n.rel>=60)miles('friend','Made a real friend: '+n.n);
 inviteCheck(n)}
function inviteCheck(n){groupInviteCheck(n);G.ajos.forEach(a=>{if(a.host===n.id&&a.status==='open'&&!a.invited&&n.rel>=36&&n.met&&!a.members.includes('player')){a.invited=true;note(n.n+' invited you to join their Ajo, '+a.name+'.','ajo');fx(n.n+' invited you to join an Ajo!','warm')}})}

function tick(h){const p=G.p;G.hour+=h;p.hunger=clamp(p.hunger+1.5*h);p.energy=clamp(p.energy-h);if(p.hunger>=80)p.happiness=clamp(p.happiness-.6*h);if(G.hour>=22)endDay(true)}

function newGame(name,age,gender){
 G={v:1,day:1,hour:6,nid:1,
 p:{name,age,gender,job:null,cash:20000,savings:0,energy:100,hunger:20,happiness:60,rep:50,trust:50,biz:10,social:10,reliab:50,loc:'home',blockedUntil:0,shiftDay:0,missed:0,boastDay:0,oppDay:0,oppN:0,bizRepDay:0},
 npcs:NP0.map(n=>({...n,met:false,lastSeen:0,hist:[],tk:{d:0,c:0},said:''})),
 tx:[],btx:[],biz:null,ajos:SEED(),debts:[],promises:[],sched:[],notes:[],th:[],rh:[],mile:{},ev:null,lastEv:'',openJobs:['shop','rider','sales'],snap:[]};
 initGroups();initPlaces();snap();note('Welcome to Kano City. You have ₦20,000. Find work, meet people — and protect your name.','info');return G}
function snap(){G.snap.push({day:G.day,cash:G.p.cash,nw:netWorth(),trust:Math.round(G.p.trust),rep:Math.round(G.p.rep)});if(G.snap.length>120)G.snap.shift()}

/* ---- movement & survival ---- */
function travel(to){if(to===G.p.loc)return false;
 G.p.loc=to;fx('You are at '+LOCS[to].n,'warm');return true}
function eat(){if(!canTime(1))return no(LATE);if(!spend(1500,'Food (jollof & chicken)','food'))return false;G.p.hunger=clamp(G.p.hunger-45);G.p.happiness=clamp(G.p.happiness+5);tick(1);return true}
function snack(){if(!canTime(1))return no(LATE);if(!spend(600,'Food (suya snack)','food'))return false;G.p.hunger=clamp(G.p.hunger-18);G.p.happiness=clamp(G.p.happiness+2);tick(1);return true}
function cook(){if(!canTime(1))return no(LATE);if(!spend(500,'Food (cooked at home)','food'))return false;G.p.hunger=clamp(G.p.hunger-30);tick(1);return true}
function rest(){if(!canTime(2))return no(LATE);G.p.energy=clamp(G.p.energy+14);G.p.happiness=clamp(G.p.happiness+2);tick(2);return true}
function call(){if(!canTime(1))return no(LATE);G.p.happiness=clamp(G.p.happiness+6);fx('Family is proud of you. +Happiness');tick(1);return true}
function gig(){if(!canTime(2))return no(LATE);if(G.p.energy<12)return no('Too tired for a keke errand.');earn(1500,'Keke errand','gig');G.p.energy=clamp(G.p.energy-10);G.p.hunger=clamp(G.p.hunger+3);tick(2);return true}
function hang(){if(!canTime(2))return no(LATE);G.p.happiness=clamp(G.p.happiness+8);G.p.social=clamp(G.p.social+1);fx('Good vibes. +Happiness');tick(2);return true}
function round_(){if(!canTime(1))return no(LATE);if(!spend(1500,'Bought a round at Suya Spot','social'))return false;here().forEach(n=>{if(n.met)rel(n.id,3,'You bought a round');else{n.met=true;n.lastSeen=G.day;rel(n.id,3,'You bought a round')}});G.p.happiness=clamp(G.p.happiness+6);addRep(1,'Generous at the Suya Spot');tick(1);return true}
function boast(){if(G.p.boastDay===G.day)return no('You already told your tall story today.');if(!canTime(1))return no(LATE);G.p.boastDay=G.day;addRep(4,'Told a tall story');addTrust(-4,'Exaggerated your success');fx('They believed it... for now.');tick(1);return true}
function sleep(){endDay(false);return true}

/* ---- work & bank ---- */
function hire(id){if(G.p.loc!=='work')return no('Go to the Workplace first.');if(!G.openJobs.includes(id))return no('That role is not hiring today.');G.p.job=id;miles('job','Got your first job: '+JOBS.find(j=>j.id===id).n);note('You are now a '+JOBS.find(j=>j.id===id).n+'.','good');return true}
function quit(){G.p.job=null;return true}
function work(){const p=G.p,j=JOBS.find(x=>x.id===p.job);if(!j)return no('Pick a job first.');if(p.loc!=='work')return no('Go to the Workplace.');if(p.shiftDay===G.day)return no('You already worked today.');if(!canTime(8))return no('Too late for a full shift. Start earlier tomorrow.');if(p.energy<j.en)return no('Too tired — you need '+j.en+' energy.');if(p.hunger>=90)return no('You are too hungry to work. Eat first.');
 p.shiftDay=G.day;earn(j.pay,'Salary — '+j.n,'salary');p.energy=clamp(p.energy-j.en);p.hunger=clamp(p.hunger+6);p.happiness=clamp(p.happiness-2);p.reliab=clamp(p.reliab+1);
 if(p.trust<65)addTrust(1,'Showed up for work');gProgress('work');tick(8);return true}
function deposit(a){if(a>G.p.cash)a=G.p.cash;if(a<=0)return no('No cash to save.');ledger(-a,'Saved at Arewa Bank','savings');G.p.savings+=a;return true}
function withdraw(a){if(a>G.p.savings)a=G.p.savings;if(a<=0)return no('Nothing saved yet.');G.p.savings-=a;ledger(a,'Withdrew from savings','savings');return true}

/* ---- mini shop ---- */

const cyc=(a,m,c)=>a.contribs.find(x=>x.cycle===(c===undefined?a.cycle:c)&&x.m===m);
function joinCheck(a){if(a.members.includes('player'))return 'You are already in this Ajo.';if(a.status!=='open')return 'This Ajo is closed.';if(blocked())return 'Blocked for '+(G.p.blockedUntil-G.day)+' more day(s) after your missed payment.';if(G.p.trust<40)return 'Members worry about your reliability (Trust is below 40).';if(myAjos().length>=2)return 'You can only be in 2 Ajo groups at once.';
 if(a.vis==='public'||a.invited)return null;
 const h=npc(a.host);if(h&&h.rel<40)return h.n+' does not know you well enough yet (needs 40 relationship or a public circle).';return null}
function atAjo(){if(G.demo)return true;return G.p.loc==='ajo'?true:no('Go to the Ajo Center for this (or enable Demo path).')}
function joinAjo(id,viaInvite){const a=ajoOf(id);if(!viaInvite&&!atAjo())return false;const why=joinCheck(a);if(why)return no(why);a.members.push('player');miles('ajo','Joined your first Ajo: '+a.name);note('You joined '+a.name+'.','ajo');fx('You joined '+a.name+'!','warm');if(a.members.length>=a.size)toStones(a);return true}

function publicAjos(){
  return G.ajos.filter(a=>a.status==='open'&&a.vis==='public'&&!a.members.includes('player')&&a.members.length<a.size);
}
function ajoAct(a,kind,txt){
  if(!a.activity)a.activity=[];
  a.activity.unshift({id:G.nid++,day:G.day,hour:G.hour,kind,txt});
  if(a.activity.length>40)a.activity.length=40;
}
function requestJoinAjo(id){
  const a=ajoOf(id);if(!a)return false;
  if(!atAjo()&&!G.demo)return false;
  const why=joinCheck(a);if(why)return no(why);
  if(a.vis!=='public'&&!a.invited)return no('This circle is private. Ask the organizer for an invite.');
  if((a.joinReqs||[]).some(r=>r.from==='player'&&r.st==='pending'))return no('Request already sent.');
  if(!a.joinReqs)a.joinReqs=[];
  a.joinReqs.push({id:'jr'+G.nid++,from:'player',day:G.day,st:'pending'});
  ajoAct(a,'join','Someone requested to join.');
  note('Join request sent to '+a.name+'.','ajo');fx('Request sent','warm');
  // NPC hosts auto-decide
  if(a.host!=='player'){
    const h=npc(a.host);const ok=G.demo||Math.random()<clamp(.35+(G.p.trust-40)/80+(h?h.rel/200:0),.2,.95);
    const req=a.joinReqs[a.joinReqs.length-1];
    if(ok){req.st='accepted';if(!a.members.includes('player')){a.members.push('player');ajoAct(a,'join',G.p.name+' joined the circle.');note(a.name+' accepted you.','ajo');fx('You are in!','good');if(a.members.length>=a.size)toStones(a)}
    }else{req.st='declined';note(a.name+' declined your request.','ajo');fx('Not this time','cold')}
  }
  return true;
}
function answerJoinReq(aid,rid,yes){
  const a=ajoOf(aid);if(!a||a.host!=='player')return no('Only the organizer can decide.');
  const r=(a.joinReqs||[]).find(x=>x.id===rid);if(!r||r.st!=='pending')return no('No pending request.');
  if(!yes){r.st='declined';ajoAct(a,'join','A join request was declined.');fx('Declined','cold');return true}
  if(a.members.length>=a.size)return no('Circle is full.');
  r.st='accepted';
  // offline: requester is always player when pending to host
  if(r.from==='player'&&!a.members.includes('player')){
    a.members.push('player');
    ajoAct(a,'join',G.p.name+' was accepted into the circle.');
    note('You accepted a member into '+a.name+'.','ajo');
  } else if(r.from!=='player'&&!a.members.includes(r.from)){
    a.members.push(r.from);
    ajoAct(a,'join',nm(r.from)+' was accepted.');
  }
  if(a.members.length>=a.size)toStones(a);
  fx('Member added','good');
  return true;
}
function ajoChatSend(id,text){
  const a=ajoOf(id);if(!a)return false;
  if(!a.members.includes('player'))return no('Join the circle to chat.');
  text=(text||'').trim().slice(0,240);if(!text)return;
  if(!a.chat)a.chat=[];
  a.chat.push({by:'player',t:text,day:G.day,hour:G.hour});
  ajoAct(a,'chat',G.p.name+': '+text.slice(0,40));
  // NPC members reply occasionally
  const others=a.members.filter(m=>m!=='player');
  if(others.length&&Math.random()<(G.demo?0.85:0.55)){
    const m=pick(others);const n=npc(m);
    const replies=['Noted, God willing.','We are watching the due date.','Who is paying this week?','Alhamdulillah.','I am around if anyone needs to talk.','Let us keep trust high.'];
    a.chat.push({by:m,t:pick(replies),day:G.day,hour:G.hour});
  }
  if(a.chat.length>80)a.chat=a.chat.slice(-80);
  G.p.trust=clamp(G.p.trust+0.1,0,100);
  fx('Sent','warm');

}

function createAjo(name,size,amt,freq){if(!atAjo())return false;if(blocked())return no('You are blocked from forming a new Ajo for '+(G.p.blockedUntil-G.day)+' day(s).');if(G.p.trust<30)return no('People will not join an Ajo run by someone with Trust below 30.');if(myAjos().length>=2)return no('You can only be in 2 Ajo groups at once.');
 const a={id:'p'+G.nid++,name:name||'Kano Hustlers',host:'player',size,amt,freq,members:['player'],status:'open',startDay:null,cycle:0,order:[],prio:[],req:null,nom:null,contribs:[],payouts:[],invited:false,inv:{},mode:'traditional',feePct:AJO_FEE_PCT,stones:{},rolled:false,feeTaken:0,vis:'public',joinReqs:[],chat:[],activity:[]};
 G.ajos.unshift(a);miles('ajohost','Started your own Ajo');ajoAct(a,'system','Circle created. Public discovery is on — people can request to join.');note('Ajo created. Invite your people or wait for public requests. Round 1 goes to you. Fee '+Math.round(AJO_FEE_PCT*100)+'% on first pot only.','ajo');return a.id}
function invite(aid,nid){const a=ajoOf(aid),n=npc(nid);if(a.status!=='open'||a.host!=='player')return false;if(!n.met)return no('Meet '+n.n+' first.');if(a.inv[nid]===G.day)return no(n.n+' already answered today.');a.inv[nid]=G.day;
 const p=G.demo?0.92:clamp(.1+n.rel/100*.8+(G.p.trust-50)/200,.05,.95);if(Math.random()<p){a.members.push(nid);fx(n.n+': "I am in!"','warm');note(n.n+' joined '+a.name+'.','ajo');if(a.members.length>=a.size)toStones(a)}else fx(n.n+': "Let me think about it... not now."','cold');return true}
function toStones(a){
 a.status='stones';if(!a.stones)a.stones={};if(a.feePct==null)a.feePct=AJO_FEE_PCT;if(!a.mode)a.mode='traditional';
 // NPCs auto-pick free stones
 const taken=new Set(Object.values(a.stones));
 a.members.filter(m=>m!=='player'&&m!==a.host&&!a.stones[m]).forEach(m=>{
  const free=STONES.filter(s=>!taken.has(s.id));
  if(!free.length)return;
  const s=pick(free);a.stones[m]=s.id;taken.add(s.id);
 });
 ajoAct(a,'system','Circle is full — time to pick stones.');note(a.name+' is full. Everyone picks a stone. Round 1 always goes to the organizer ('+nm(a.host)+'). Later pots follow the stone roll.','ajo');
 fx('Pick your stone','warm');
}
function toVoting(a){toStones(a)}
function freeStones(a){const taken=new Set(Object.values(a.stones||{}));return STONES.filter(s=>!taken.has(s.id))}
function pickStone(id,stoneId){
 const a=ajoOf(id);if(!a||a.status!=='stones')return no('Stone pick is closed.');
 if(!a.members.includes('player'))return no('You are not in this Ajo.');
 if(a.stones.player)return no('You already chose a stone.');
 if(!freeStones(a).some(s=>s.id===stoneId))return no('That stone is taken.');
 a.stones.player=stoneId;
 const st=STONES.find(s=>s.id===stoneId);
 note('You chose the '+st.n+' stone for '+a.name+'.','ajo');fx(st.ic+' '+st.n,'warm');
 return true;
}
function stonesReady(a){
 // Host is fixed first — every other member needs a stone
 return a.members.filter(m=>m!==a.host).every(m=>a.stones&&a.stones[m]);
}
function rollStones(id){
 const a=ajoOf(id);if(!a||a.status!=='stones')return no('Cannot roll yet.');
 if(a.host==='player'&&!atAjo())return false;
 if(!stonesReady(a))return no('Everyone still needs to pick a stone.');
 const rest=a.members.filter(m=>m!==a.host);
 a.order=[a.host,...shuffle(rest)];
 a.rolled=true;
 note(a.name+' stone roll done. Payout order is set. Organizer first, then the stones.','ajo');
 fx('Stones rolled!','good');
 return true;
}
function stoneOf(a,m){const id=a.stones&&a.stones[m];return id?STONES.find(s=>s.id===id):null}

function voteScore(v,reason){const base=v.rel*.45+G.p.trust*.3+G.p.rep*.1+({emergency:18,business:G.biz?14:6,plain:-8}[reason])+(v.tags.includes('generous')?8:0)-(v.tags.includes('opportunistic')&&v.rel<60?5:0)-G.p.missed*6;return base}
function odds(a,reason){const vs=a.members.filter(m=>m!=='player').map(npc);const yes=vs.filter(v=>voteScore(v,reason)>=52).length/vs.length;return yes>=.75?'Good':yes>=.5?'Fair':'Slim'}
function reqPriority(id,reason){const a=ajoOf(id);if(!a.members.includes('player'))return no('You are not a member of this Ajo.');if(!atAjo())return false;if(a.status!=='voting'||a.req)return no('You already made your case.');
 const votes=a.members.filter(m=>m!=='player').map(m=>{const v=npc(m),s=voteScore(v,reason)+ri(-8,8),y=s>=52;return{id:m,y,why:y?(v.rel>=60?'trusts you':'is willing to give you a chance'):(v.rel<45?'barely knows you':G.p.trust<55?'has doubts about your reliability':'needs the money too')}});
 const yes=votes.filter(v=>v.y).length,passed=yes>votes.length/2;a.req={reason,votes,passed};
 if(passed){a.prio.push('player');votes.filter(v=>v.y).forEach(v=>rel(v.id,2,'Backed your early payout'));fx('The group voted: you get priority!','warm');miles('vote','Won an Ajo vote on trust alone')}else{G.p.happiness=clamp(G.p.happiness-3);fx('The group said no. Build more trust first.','cold')}return true}
function voteNom(id,support){const a=ajoOf(id);if(!a.members.includes('player'))return no('You are not a member of this Ajo.');if(!atAjo())return false;const nm_=a.nom;if(!nm_||nm_.done)return false;const n=npc(nm_.npc);
 const others=a.members.filter(m=>m!=='player'&&m!==nm_.npc);const votes=[{id:'player',y:support}];
 others.forEach(m=>{const s=n.tr*.5+n.rep*.2+12+ri(-10,10);votes.push({id:m,y:s>=45})});
 const yes=votes.filter(v=>v.y).length,passed=yes>votes.length/2;Object.assign(nm_,{done:true,votes,passed});if(passed)a.prio.push(nm_.npc);
 rel(nm_.npc,support?4:-3,support?'You backed their request':'You opposed their request');if(support)n.lastSeen=G.day;
 fx(passed?n.n+' gets early payout.':n.n+"'s request did not pass.");return true}
function startAjo(id){const a=ajoOf(id);if(!a.members.includes('player'))return no('You are not a member of this Ajo.');if(!atAjo())return false;
 if(a.status==='stones'){if(!a.rolled){if(!rollStones(id))return false} }
 else if(a.status!=='voting'&&a.status!=='stones')return no('This Ajo is not ready to start.');
 if(!a.order.length){
  if(a.mode==='traditional'||a.status==='stones'){a.order=[a.host,...shuffle(a.members.filter(m=>m!==a.host))]}
  else{const first=[...new Set(a.prio)];a.order=[...first,...shuffle(a.members.filter(m=>!first.includes(m)))]}
 }
 a.status='active';a.startDay=G.day+1;a.cycle=0;a.rolled=true;
 note(a.name+' starts tomorrow. Round 1 pot goes to the organizer ('+nm(a.order[0])+').'+(a.host==='player'?' Ajoloop fee '+Math.round((a.feePct||AJO_FEE_PCT)*100)+'% comes from that first pot only.':''),'ajo');
 fx(a.name+' begins tomorrow!','warm');return true}
function ontime(a){addTrust(3,'Kept an Ajo contribution');G.p.reliab=clamp(G.p.reliab+1);a.members.forEach(m=>{if(m!=='player')rel(m,1,'You kept your Ajo promise')});miles('contrib','Made your first Ajo contribution')}
function payAjo(id){const a=ajoOf(id);if(!a.members.includes('player'))return no('You are not a member of this Ajo.');if(a.status!=='active')return no('This Ajo is not running.');if(cyc(a,'player'))return no('Already paid this cycle.');if(G.day<dueDay(a)-2)return no('Too early — contributions open 2 days before the due date (Day '+dueDay(a)+').');
 if(!spend(a.amt,'Ajo contribution — '+a.name,'ajo'))return false;a.contribs.push({cycle:a.cycle,m:'player',st:'paid',day:G.day});ontime(a);return true}
function runCycle(a){const c=a.cycle,rec=a.order[c],P=G.p;let pot=0,short=[],ded=0;
 const trad=a.mode==='traditional'||a.feePct!=null;
 G.debts.filter(d=>d.ajo===a.id&&!d.paid&&d.m!=='player').forEach(d=>{if(Math.random()<.8){d.paid=true;pot+=d.amt;note(nm(d.m)+' cleared an earlier shortfall of '+fmt(d.amt)+'.','ajo')}});
 a.members.forEach(m=>{
  // Traditional: organizer does not contribute on round 1 (they receive the pot)
  if(trad&&c===0&&m===a.host){a.contribs.push({cycle:c,m,st:'host_skip',day:G.day});return}
  if(m==='player'){
   if(cyc(a,'player',c)){pot+=a.amt;return}
   if(P.cash>=a.amt){ledger(-a.amt,'Ajo contribution — '+a.name,'ajo');a.contribs.push({cycle:c,m,st:'paid',day:G.day});pot+=a.amt;ontime(a)}
   else if(rec==='player'){ded=a.amt;pot+=a.amt;a.contribs.push({cycle:c,m,st:'paid',day:G.day})}
   else missAjo(a,c,rec)
  }else{const n=npc(m),pm=clamp((100-n.tr)/100*.28,0,.28);
   if(Math.random()<pm){a.contribs.push({cycle:c,m,st:'missed',day:G.day});G.debts.push({id:G.nid++,ajo:a.id,cycle:c,m,to:rec,amt:a.amt,day:G.day,paid:false});short.push(n.n);note(n.n+' missed their '+a.name+' contribution.','bad')}
   else{a.contribs.push({cycle:c,m,st:'paid',day:G.day});pot+=a.amt}}});
 // Platform fee on organizer's first pot only
 let fee=0;
 if(trad&&c===0&&rec===a.host){
  fee=Math.round(pot*(a.feePct||AJO_FEE_PCT));
  a.feeTaken=(a.feeTaken||0)+fee;
  if(fee>0) note('Ajoloop agent fee '+fmt(fee)+' taken from round 1 pot ('+Math.round((a.feePct||AJO_FEE_PCT)*100)+'%). Simulated offline.','ajo');
 }
 if(rec==='player'){const pay=Math.max(0,pot-ded-fee);earn(pay,'AJO PAYOUT — '+a.name,'ajo');fx('AJO PAYOUT|'+fmt(pay),'payout');addRep(2,'Completed an Ajo cycle');miles('payout','Received your first Ajo payout');note('AJO PAYOUT: '+fmt(pay)+' from '+a.name+'.'+(fee?' Fee '+fmt(fee)+'.':'')+(short.length?' Short because '+short.join(', ')+' missed.':''),'good');a.payouts.push({cycle:c,to:rec,amt:pay,fee,day:G.day})}
 else{const pay=Math.max(0,pot-fee);note(npc(rec).n+' received the '+a.name+' pot ('+fmt(pay)+(fee?'; fee '+fmt(fee):'')+').','ajo');a.payouts.push({cycle:c,to:rec,amt:pay,fee,day:G.day})}
 a.cycle++;if(a.cycle>=a.size){a.status='done';if(a.members.includes('player')){addTrust(5,'Completed an Ajo circle');addRep(5,'Completed an Ajo circle');miles('ajodone','Completed a full Ajo circle');note(a.name+' is complete. Everyone got paid. That is trust.','good')}}}
function missAjo(a,c,rec){const P=G.p,t0=Math.round(P.trust),r0=Math.round(P.rep);a.contribs.push({cycle:c,m:'player',st:'missed',day:G.day});G.debts.push({id:G.nid++,ajo:a.id,cycle:c,m:'player',to:rec,amt:a.amt,day:G.day,paid:false});

function requestBizVisit(bid){
  const b=bizById(bid); if(!b||b.closed) return fx('Business not found.','warn');
  if(b.owner==='player') return fx('This is your own shop.','warm');
  if((G.visits||[]).some(v=>v.biz===bid&&v.by==='player'&&v.st==='pending'))return fx('Visit request already waiting.','warm');
  if((G.visits||[]).some(v=>v.biz===bid&&v.by==='player'&&v.st==='approved'&&v.day===G.day))return fx('Already visited today.','warm');
  const v={id:'v_'+Date.now().toString(36),biz:bid,by:'player',day:G.day,hour:G.hour,st:'pending',bought:false,ack:false};
  if(!G.visits)G.visits=[];
  G.visits.push(v);
  if(b.owner!=='player'){
    const n=npc(b.owner); if(n&&!n.met){n.met=true;n.lastSeen=G.day}
    // NPC owners: simulate review (demo almost always accepts)
    const accept=G.demo||Math.random()<0.75;
    if(accept) approveBizVisit(v.id,true);
    else {v.st='declined';note(b.name+' could not host a visit today.','ajo');fx('Visit declined','cold')}
  } else {
    note('Visit request sent to '+b.name+'.','ajo');fx('On the way… waiting for approval','warm');
  }
  return v;
}

function approveBizVisit(vid,yes){
  const v=(G.visits||[]).find(x=>x.id===vid);if(!v)return no('Visit not found.');
  const b=bizById(v.biz);if(!b)return no('Shop missing.');
  if(!yes){v.st='declined';note('Visit to '+b.name+' declined.','ajo');fx('Declined','cold');return true}
  v.st='approved';v.ack=true;v.hour=G.hour;
  b.visits=(b.visits||0)+1;
  b.trust=clamp((b.trust||40)+4,0,100);
  // Trust for both sides
  if(v.by==='player'){
    G.p.trust=clamp(G.p.trust+1.2,0,100);
    G.p.rep=clamp(G.p.rep+0.4,0,100);
    if(b.owner!=='player'){const n=npc(b.owner);if(n){n.rel=clamp(n.rel+5,0,100);n.hist.push({day:G.day,why:'Approved your shop visit',d:5});if(n.hist.length>12)n.hist.shift()}}
  }
  note('Visit approved at '+b.name+'. Trust grew — showing up in person matters.','good');
  fx('Visit confirmed ✓','good');
  return true;
}

function trustActivity(uid,kind){

    wave:{me:'Waved and said sannu.',them:'Waved back.',rel:1,trust:0.2},
    help:{me:'Offered a small favour in the neighbourhood.',them:'Appreciated the help.',rel:3,trust:0.5},
    intro:{me:'Introduced myself properly.',them:'Glad to know you better.',rel:2,trust:0.3},
    vouch:{me:'Spoke well of them to others.',them:'Heard you had their back.',rel:4,trust:0.4,rep:0.3}
  };
  const A=acts[kind]||acts.wave;
  n.rel=clamp(n.rel+A.rel,0,100);
  G.p.trust=clamp(G.p.trust+(A.trust||0),0,100);
  if(A.rep)G.p.rep=clamp(G.p.rep+A.rep,0,100);
  n.hist.push({day:G.day,why:A.me,d:A.rel});
  if(n.hist.length>12)n.hist.shift();

  th.push({by:uid,t:A.them,day:G.day,hour:G.hour});

}

function chatGame(uid,kind){
  const n=npc(uid); if(!n) return;
  if(!n.met){n.met=true;n.lastSeen=G.day}
  const th=chatThread(uid);
  const lines={
    greet:{me:'Just checking in — how is business?',them:pick(['Alhamdulillah, we are managing.','Quiet today, but we push.','Better when people show up.']),rel:2},
    plan:{me:'We should meet at a public place this week.',them:pick(['Market is fine.','Suya Spot after work?','Tell me a day that works.']),rel:3},
    stone:{me:'Stone toss — I call open hand.',them:pick(['Ha! I take the other. Next time.','You win this one.','Draw — we go again later.']),rel:2}
  };
  const L=lines[kind]||lines.greet;
  th.push({by:'player',t:L.me,day:G.day,hour:G.hour});
  th.push({by:uid,t:L.them,day:G.day,hour:G.hour});
  n.rel=clamp(n.rel+L.rel,0,100);
  if(kind==='plan') G.p.rep=clamp(G.p.rep+0.2,0,100);
  if(kind==='greet') G.p.trust=clamp(G.p.trust+0.15,0,100);
  note('Chat with '+n.n+' — relationship +'+L.rel+'.','ajo');
  fx('Connection +'+L.rel,'warm');
}

function chatSend(uid,text){
  text=(text||'').trim().slice(0,200); if(!text) return;
  if(G.blk.includes(uid)) return fx('You blocked this person.','warn');
  const n=npc(uid); if(!n) return;
  if(!n.met){n.met=true;n.lastSeen=G.day}
  const th=chatThread(uid);
  th.push({by:'player',t:text,day:G.day,hour:G.hour});
  n.rel=clamp(n.rel+1.5,0,100);
  // simple NPC reply
  const replies=['God bless. How is work?','I am around '+((bizByOwner(uid)||{}).area||'town')+'.','We should meet at the market one day.','Noted — I will check.',"Insha'Allah. Stay well."];
  th.push({by:uid,t:pick(replies),day:G.day,hour:G.hour});
  if(th.length>40) G.chats[Object.keys(G.chats).find(k=>G.chats[k]===th)]=th.slice(-40);
  note('Message sent to '+n.n+'.');
}
function mapPins(){
  const pins=[];
  Object.entries(KANO_MAP.areas).forEach(([name,a])=>{
    pins.push({id:'area_'+name,kind:'area',n:name,x:a.x,y:a.y,ic:'📍',sub:a.blurb});
  });
  KANO_MAP.publicNodes.forEach(p=>pins.push({...p,kind:'public',sub:p.area}));
  (G.bizs||[]).filter(b=>!b.closed).forEach(b=>{
    const base=KANO_MAP.areas[b.area]||{x:50,y:50};
    const jitter=(b.id.charCodeAt(b.id.length-1)%7)-3;
    pins.push({id:b.id,kind:'biz',n:b.name,x:clamp(base.x+jitter,5,95),y:clamp(base.y+jitter,5,95),ic:b.ic||'🏪',sub:b.area+' · '+b.cat,biz:b});
  });
  if(G.p.home&&G.p.home.area&&KANO_MAP.areas[G.p.home.area]){
    const h=KANO_MAP.areas[G.p.home.area];
    pins.push({id:'home',kind:'home',n:'Your home',x:h.x-3,y:h.y+3,ic:'🏠',sub:G.p.home.area+(G.p.home.label?' · '+G.p.home.label:'')});
  }
  return pins;
}

function demoFillAjo(id){
  const a=ajoOf(id);if(!a||a.host!=='player'||a.status!=='open')return no('Open your own gathering circle first.');
  const need=a.size-a.members.length;
  const cands=G.npcs.filter(n=>n.met&&!a.members.includes(n.id)).sort((x,y)=>y.rel-x.rel);
  let added=0;
  for(const n of cands){
    if(added>=need)break;
    a.members.push(n.id);added++;
  }
  if(a.members.length>=a.size)toStones(a);
  note('Demo filled '+a.name+' with '+added+' neighbour(s).','ajo');
  fx('Circle filled','good');
  return true;
}
function demoAdvanceToPayout(id){
  const a=ajoOf(id);if(!a)return no('No Ajo');
  if(a.status==='stones'&&!a.rolled)rollStones(id);
  if(a.status==='stones'||a.status==='voting'){a.status='active';a.startDay=G.day;a.cycle=0;if(!a.order.length)a.order=[a.host,...shuffle(a.members.filter(m=>m!==a.host))];a.rolled=true}
  if(a.status!=='active')return no('Ajo not running');
  G.p.cash=Math.max(G.p.cash,a.amt*a.size+20000);
  G.day=Math.max(G.day,dueDay(a));
  runCycle(a);
  fx('Cycle resolved','good');
  return true;
}

 <div class="sm" style="margin-top:6px;line-height:1.4">Organizer takes <b>round 1</b>. Fee <b>${Math.round((a.feePct||AJO_FEE_PCT)*100)}%</b> on that pot. Later pots follow the <b>stone roll</b>. Chat keeps the circle warm.</div></div>`;

 if(a.host==='player'&&st==='open'){
  h+=`<div class="row" style="gap:8px;margin:10px 0"><button class="btn sm ${a.vis==='public'?'':'ghost'}" data-a="ajoVis" data-id="${a.id}" data-v="public">🌐 Public</button>
   <button class="btn sm ${a.vis==='private'?'':'ghost'}" data-a="ajoVis" data-id="${a.id}" data-v="private">🔒 Private</button></div>`;
 }

 const pending=(a.joinReqs||[]).filter(r=>r.st==='pending');
 if(a.host==='player'&&pending.length){
  h+=`<section class="card"><b>Join requests</b>${pending.map(r=>`<div class="inv-card" style="margin:8px 0"><b>${r.from==='player'?'A neighbour':esc(nm(r.from))}</b><div class="muted sm">Day ${r.day}</div>
   <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm green" data-a="ajoAnsReq" data-id="${a.id}" data-r="${r.id}" data-y="1">Accept</button>
   <button class="btn sm ghost" data-a="ajoAnsReq" data-id="${a.id}" data-r="${r.id}" data-y="0">Decline</button></div></div>`).join('')}</section>`;
 }

 const memRows=a.members.map(m=>{
  const stn=stoneOf(a,m);const isHost=m===a.host;
  const c=a.status==='active'?cyc(a,m):null;
  return `<div class="row sp" style="margin-top:8px"><span>${m==='player'?avatar(P.gender):(npc(m)?npc(m).em:'?')} ${nm(m)}${isHost?' · organizer':''}${stn?' '+stn.ic:''}</span>
  ${a.status==='active'?`<span class="pill ${c?(c.st==='paid'||c.st==='host_skip'?'ok':'no'):'wait'}">${c?(c.st==='host_skip'?'Organizer':c.st==='paid'?'Paid':'Missed'):'Pending'}</span>`:(stn?`<span class="pill ok">${stn.ic} ${stn.n}</span>`:(isHost?'<span class="pill wait">First pot</span>':'<span class="pill wait">No stone</span>'))}</div>`;
 }).join('');
 h+=`<section class="card"><b>Members (${a.members.length}/${a.size})</b>${memRows}</section>`;

 if(st==='open'&&a.host!=='player'){
  const why=joinCheck(a);
  const pendingMe=(a.joinReqs||[]).some(r=>r.from==='player'&&r.st==='pending');
  h+=`<div class="card" style="background:var(--card)">${why?'🔒 '+why:a.vis==='public'?'🌐 Public circle — request to join.':'Private — need an invite.'}</div>`;
  if(!a.members.includes('player')){
   if(pendingMe)h+=`<div class="pill wait">Request pending</div>`;
   else if(!why&&a.vis==='public')h+=`<button class="btn" data-a="ajoRequest" data-id="${a.id}">Request to join</button>`;
   else if(!why)h+=`<button class="btn" data-a="join" data-id="${a.id}" ${P.loc!=='ajo'&&!G.demo?'disabled':''}>Join</button>`;
  }
 }
 if(st==='open'&&a.host==='player'){const cands=G.npcs.filter(n=>n.met&&!a.members.includes(n.id)).sort((x,y)=>y.rel-x.rel);h+=`<section class="card"><b>Invite your people</b><div class="muted tiny">Traditional start — people you know.</div>${cands.length?cands.map(n=>`<div class="tx"><div class="row"><span style="font-size:22px">${n.em}</span><div><b>${n.n}</b><div class="tiny muted">${relLabel(n)}</div></div></div><button class="btn sm" data-a="inv" data-id="${a.id}" data-n="${n.id}" ${a.inv[n.id]===G.day?'disabled':''}>Invite</button></div>`).join(''):'<div class="muted sm">Meet people first or start Demo path.</div>'}
 ${G.demo&&a.members.length<a.size?`<button class="btn sm" style="margin-top:10px" data-a="demoFillAjo" data-id="${a.id}">Demo: fill circle now</button>`:''}</section>`}

 if(st==='stones'){
  h+=`<section class="card"><b>🪨 Stones</b><div class="muted sm" style="margin:6px 0 10px">Pick a free stone. Organizer is always paid first.</div>`;
  if(a.members.includes('player')&&!a.stones.player){
   h+=`<div class="stone-grid">${freeStones(a).map(s=>`<button class="stone-btn" data-a="pickStone" data-id="${a.id}" data-s="${s.id}"><span class="sic">${s.ic}</span><span class="sn">${s.n}</span></button>`).join('')}</div>`;
  } else if(a.stones.player){
   const mine=stoneOf(a,'player');h+=`<div class="muted sm">Your stone: <b>${mine?mine.ic+' '+mine.n:''}</b></div>`;
  }
  if(a.rolled){
   h+=`<div class="section-label">Payout order</div>${a.order.map((m,i)=>`<div class="row sp sm" style="margin-top:6px"><span>${i+1}. ${nm(m)}${m===a.host?' (organizer)':''} ${stoneOf(a,m)?stoneOf(a,m).ic:''}</span>${i===0?'<span class="badge-ajo">Round 1</span>':''}</div>`).join('')}`;
   if(a.members.includes('player'))h+=`<button class="btn" style="margin-top:12px" data-a="ajoStart" data-id="${a.id}" ${P.loc!=='ajo'&&!G.demo?'disabled':''}>Start circle (begins tomorrow)</button>`;
  } else if(stonesReady(a)){
   h+=`<button class="btn" style="margin-top:12px" data-a="rollStones" data-id="${a.id}" ${a.host==='player'&&P.loc!=='ajo'&&!G.demo?'disabled':''}>🎲 Roll the stones</button>`;
  } else h+=`<div class="muted sm" style="margin-top:8px">Waiting for stones…</div>`;
  h+=`</section>`;
 }

 if(st==='active'){
  const d=dueDay(a),rec=a.order[a.cycle],paid=!!cyc(a,'player');
  h+=`${G.demo?`<button class="btn sm ghost" style="margin-bottom:10px" data-a="demoAdvance" data-id="${a.id}">Demo: resolve this round now</button>`:''}
  <section class="card"><b>Round ${a.cycle+1} of ${a.size}</b>
   <div class="row sp" style="margin-top:8px"><span class="muted sm">Due</span><b>Day ${d}</b></div>
   <div class="row sp"><span class="muted sm">Receives pot</span><b>${nm(rec)}${a.cycle===0?' · organizer':''}</b></div>
   ${a.members.includes('player')&&!paid&&!(a.cycle===0&&a.host==='player')?`<button class="btn" style="margin-top:12px" data-a="pay" data-id="${a.id}">Pay ${fmt(a.amt)}</button>`:''}
   ${a.cycle===0&&a.host==='player'?`<div class="pill ok" style="margin-top:10px">Organizer — no contribution this round</div>`:''}
   ${paid?`<div class="pill ok" style="margin-top:10px">You paid this round</div>`:''}
  </section>`;
  if(a.order.length){h+=`<section class="card"><b>Order</b>${a.order.map((m,i)=>`<div class="row sp sm" style="margin-top:6px"><span class="${i===a.cycle?'':'muted'}">${i+1}. ${nm(m)} ${stoneOf(a,m)?stoneOf(a,m).ic:''}</span>${i<a.cycle?'<span class="pill ok">Paid out</span>':i===a.cycle?'<span class="pill wait">Current</span>':''}</div>`).join('')}</section>`}
 }

 if(a.payouts&&a.payouts.length){h+=`<section class="card"><b>Payouts</b>${a.payouts.map(p=>`<div class="tx"><div><b>${nm(p.to)}</b><div class="tiny muted">Round ${p.cycle+1}${p.fee?` · fee ${fmt(p.fee)}`:''}</div></div><span class="pos">${fmt(p.amt)}</span></div>`).join('')}</section>`}
 if(st==='done')h+=`<div class="card empty"><div class="big">✅</div>Circle complete.</div>`;
 h+=`<button class="btn ghost" style="margin-top:12px" data-a="ajoTab" data-v="chat">💬 Open circle chat</button>`;
 return h}

function notesSheet(){return `<h2>Notifications</h2><div style="margin-top:12px">${G.notes.length?G.notes.slice(0,30).map(n=>`<div class="note ${n.kind}" style="margin:0 0 8px"><div class="tiny muted">Day ${n.day}</div>${esc(n.txt)}</div>`).join(''):'<div class="muted">Nothing yet.</div>'}</div>`}

const GO=(o,k,vals,cur,lab)=>`<div class="opts">${vals.map(v=>`<button data-a="g_set" data-o="${o}" data-k="${k}" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${lab?lab(v):esc(v)}</button>`).join('')}</div>`;
const GT=(k,ph,max,def,enter)=>`<input type="text" data-f="${k}" maxlength="${max}" placeholder="${esc(ph)}" value="${esc(UI.gi[k]!==undefined?UI.gi[k]:(def||''))}" ${enter?`data-enter="${enter}"`:''} autocomplete="off">`;
const dayRel=d=>d===G.day?'today':d===G.day+1?'tomorrow':'Day '+d;
const JOINL={open:'Open: anyone can join',approval:'Ask an admin first',invite:'Invitation only'};
const CHL={work:'work shifts',talk:'conversations',shop:'shop sessions'};
const avOf=id=>id==='player'?avatar(G.p.gender):(npc(id)?npc(id).em:'🧑🏾');

function gcardRow(x,extra){
 return `<button class="g-card" data-a="g_open" data-id="${x.id}"><div class="g-av">${x.av}</div><div class="meta"><b>${esc(x.name)}</b><div class="l">${esc(x.cat)} · ${x.count} member${x.count===1?'':'s'}${x.area?' · '+esc(x.area):''}${extra?' · '+extra:''}</div></div>${x.vis==='public'?'<span class="pill ok">Public</span>':'<span class="pill wait">Private</span>'}</button>`;
}

function groupsView(){const mine=G.groups.filter(g=>!g.dead&&g.mem.player);
 const invs=[];G.groups.forEach(g=>{if(!g.dead)g.inv.forEach(i=>{if(i.to==='player'&&invState(i)==='pending')invs.push({g,i})})});
 const q=(UI.gi.q||'').trim(),cat=UI.gcat||'';let disc='';
 if(q||cat){const r=searchGroups(q,cat);disc=`<div class="section-label">Results · ${r.length}</div>${r.length?r.map(x=>gcardRow(x)).join(''):'<div class="card empty"><div class="big">🔎</div>Nothing found. Try another word, or create the group yourself.</div>'}`}
 else{const S=discoverSections(),seen=new Set(),sect=(t,s,l)=>{l=l.filter(x=>!seen.has(x.id));l.forEach(x=>seen.add(x.id));return l.length?`<div class="section-label">${t}</div><div class="muted tiny px" style="margin:-2px 0 8px">${s}</div>${l.map(x=>gcardRow(x,x.via?'via '+esc(x.via.join(', ')):'')).join('')}`:''};
  disc=sect('Friends are in','Public groups your friends chose to show',S.friends)+sect('For your interests','From interests you picked below',S.rec)+sect('Near you','Only if you chose an area',S.nearby)+sect('Happening soon','Meetups and challenges',S.game)+sect('Business & creators','Communities for people who make and sell',S.biz);
  if(!disc)disc='<div class="card empty"><div class="big">🏘️</div>Nothing new to suggest.<div class="muted sm" style="margin-top:6px">Pick interests below, search, or create a group.</div></div>'}
 return `<div class="sec">Groups<small>Communities for friends and shared activities — free to join. Not an Ajo.</small></div>
 <div class="note-sep">Members marked NPC are simulated. Real player-to-player groups need the online version. Joining a group never enrolls you in Ajo money circles.</div>
 <div class="px row" style="gap:10px;margin:10px 0"><button class="btn" data-a="g_new">＋ Create group</button><button class="btn ghost" data-a="g_code">Join with code</button></div>
 ${invs.length?`<div class="section-label">Invitations · ${invs.length}</div><div class="muted tiny px" style="margin-bottom:8px">Nothing happens until you accept.</div>${invs.map(({g,i})=>`<div class="inv-card"><b>${esc(g.name)}</b><div class="muted sm" style="margin-top:4px">From ${esc(nm(i.by))} · expires Day ${i.exp}</div><div class="row" style="margin-top:12px;gap:8px"><button class="btn sm green" style="flex:1" data-a="g_ans" data-id="${g.id}" data-i="${i.id}" data-y="1">Accept</button><button class="btn sm ghost" style="flex:1" data-a="g_ans" data-id="${g.id}" data-i="${i.id}" data-y="0">Decline</button></div></div>`).join('')}`:''}
 <div class="section-label">My groups · ${mine.length}</div>
 ${mine.length?mine.map(g=>gcardRow(glimpse(g),ROLEL[g.mem.player.role])).join(''):'<div class="card empty"><div class="big">✨</div>You are not in a group yet.<div class="muted sm" style="margin-top:6px">Create one for your street, hustle, or friends — any player can host.</div><button class="btn sm" style="margin-top:12px" data-a="g_new">Create a group</button></div>'}
 <div class="section-label">Discover</div>
 <div class="card flat" style="margin:8px 12px">${GT('q','Search by name or interest',30,'','g_search')}<div class="row" style="margin-top:8px;gap:8px"><button class="btn sm" data-a="g_search">Search</button>${q||cat?'<button class="btn sm ghost" data-a="g_clear">Clear</button>':''}</div></div>
 <div class="seg">${G_CATS.map(c=>`<button data-a="g_cat" data-v="${c}" class="${cat===c?'on':''}">${c}</button>`).join('')}</div>
 ${disc}
 <section class="card"><b>Your interests</b><div class="muted tiny">Stored on this device only — used to suggest groups.</div><div class="opts">${G_CATS.map(c=>`<button data-a="g_int" data-v="${c}" class="${G.p.ints.includes(c)?'on':''}">${c}</button>`).join('')}</div>
 <label class="l">Show groups near me</label><div class="muted tiny">Off by default. No GPS: you pick an area yourself.</div><div class="opts"><button data-a="g_area" data-v="" class="${G.p.shareArea?'':'on'}">Off</button>${G_AREAS.map(a=>`<button data-a="g_area" data-v="${a}" class="${G.p.area===a?'on':''}">${a}</button>`).join('')}</div></section>`}

const gpostHtml=(g,p,isRep,staff)=>`<div class="msg ${isRep?'reply':''} ${p.kind==='announce'?'ann':''}"><div class="by">${p.kind==='announce'?'📣 ':''}${esc(nm(p.by))} ${npcTag(p.by)} <span class="muted">· Day ${p.day}</span></div>${p.hid?'<i class="muted">[hidden by a moderator]</i> ':''}${esc(p.txt)}${staff===null?'':`<div class="mact">${!isRep&&p.kind==='msg'?`<button data-a="g_reply" data-p="${p.id}">Reply</button>`:''}${p.by!=='player'?`<button data-a="g_rep" data-p="${p.id}">Report</button>`:''}${staff&&!p.hid?`<button data-a="g_hide" data-p="${p.id}">Hide</button>`:''}</div>${UI.gconf==='rep:'+p.id?`<div class="opts">${['Spam','Abuse or bullying','Scam','Other'].map(r=>`<button data-a="g_report" data-p="${p.id}" data-r="${r}">${r}</button>`).join('')}</div>`:''}`}</div>`;

function grpSheet(id){const v=viewGroup(id);if(!v)return `<h2>Group unavailable</h2><div class="muted sm" style="margin-top:8px">This group is private, or it does not exist.</div>`;
 const g=grp(id),head=`<div class="row" style="margin:6px 0 4px"><div class="av" style="width:56px;height:56px;font-size:32px">${v.av}</div><div style="min-width:0"><h2>${esc(v.name)}</h2><div class="muted sm">${esc(v.cat)} · ${v.count} member${v.count===1?'':'s'}${v.area?' · '+esc(v.area):''}</div></div></div><div style="margin-bottom:8px">${visPill(v)}${v.member?rolePill(v.role):''}${(v.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
 if(!v.member)return head+gNon(v,g);
 const staff=['mod','admin','owner'].includes(v.role),tabs=[['home','Home'],['chat','Chat'],['events','Activities'],['people','People']].concat(staff?[['manage','Manage']]:[]),tab=tabs.some(t=>t[0]===UI.gt)?UI.gt:'home';
 return head+`<div class="seg" style="margin:8px 0">${tabs.map(([k,l])=>`<button data-a="g_tab" data-v="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>`+({home:gHome,chat:gChat,events:gEvents,people:gPeople,manage:gManage}[tab])(g,v)}

function gNon(v,g){const di=g.inv.find(i=>i.to==='player'&&invState(i)==='pending');let act;
 if(di)act=`<div class="row"><button class="btn green" data-a="g_ans" data-id="${v.id}" data-i="${di.id}" data-y="1">Accept invitation</button><button class="btn ghost" data-a="g_ans" data-id="${v.id}" data-i="${di.id}" data-y="0">Decline</button></div>`;
 else if(v.join==='open')act=`<button class="btn" data-a="g_join" data-id="${v.id}">Join group</button>`;
 else if(v.join==='approval')act=g.req.includes('player')?`<button class="btn" disabled>Request sent. Waiting for an admin.</button>`:`<button class="btn" data-a="g_join" data-id="${v.id}">Request to join</button>`;
 else act=`<div class="note">This group is invite-only. Ask a member for an invitation or a code.</div>`;
 return `<div class="muted sm">${esc(v.desc)||'No description yet.'}</div>
 ${v.gated?'<div class="note grp" style="margin:10px 0">Messages, members and activities are only visible to members.</div>':''}
 ${v.rules&&v.rules.length?`<section class="card"><b>📜 Rules</b>${v.rules.map((r,i)=>`<div class="sm" style="margin-top:6px">${i+1}. ${esc(r)}</div>`).join('')}</section>`:''}
 ${v.announcements&&v.announcements.length?`<section class="card"><b>📣 Announcements</b><div style="margin-top:8px">${v.announcements.map(p=>gpostHtml(g,p,false,null)).join('')}</div></section>`:''}
 ${v.events&&v.events.length?`<section class="card"><b>🗓️ Coming up</b>${v.events.slice(0,3).map(e=>`<div class="tx"><span>${esc(e.title)}</span><span class="muted tiny">${e.kind==='meetup'?dayRel(e.day):'until Day '+e.dl}</span></div>`).join('')}</section>`:''}
 <div style="margin-top:12px">${act}</div>`}

function gHome(g,v){const me=rk(g,'player'),canInv=gcan(g,'player','invite')&&!(me<2&&g.memInvite==='admins'),props=g.ajoP.filter(p=>p.st==='proposed'),m=g.mem.player,hand=gcan(g,'player','editInfo');
 const succ=g.owner==='player'?nextOwner(g,'player'):null;
 return `<div class="muted sm">${esc(v.desc)||'No description yet.'}</div>
 ${canInv?`<button class="btn" style="margin-top:12px" data-a="g_inv" data-id="${g.id}">＋ Invite friends</button>`:''}
 ${v.rules.length?`<section class="card"><b>📜 Rules</b>${v.rules.map((r,i)=>`<div class="sm" style="margin-top:6px">${i+1}. ${esc(r)}</div>`).join('')}</section>`:''}
 <section class="card"><b>📣 Announcements</b><div style="margin-top:8px">${v.announcements.length?v.announcements.map(p=>gpostHtml(g,p,false,null)).join(''):'<div class="muted sm">No announcements yet.'+(hand?' Post one from Manage.':'')+'</div>'}</div></section>
 <section class="card"><b>🗓️ Coming up</b>${v.events.length?v.events.slice(0,3).map(e=>`<div class="tx"><span>${e.kind==='meetup'?'🗓️':'🏆'} ${esc(e.title)}</span><span class="muted tiny">${e.kind==='meetup'?dayRel(e.day):'until Day '+e.dl}</span></div>`).join('')+`<button class="btn ghost sm" style="margin-top:8px" data-a="g_tab" data-v="events">See activities</button>`:'<div class="muted sm" style="margin-top:6px">Nothing planned yet.</div>'}</section>
 <section class="card"><b>🤝 Ajo circles</b><div class="muted tiny" style="margin:4px 0 8px">A group is for friends and fun. An Ajo is a separate savings circle with real contributions. Being in this group never puts you in an Ajo and nothing is paid from here.</div>

 ${props.map(p=>`<div class="card" style="background:var(--card);margin:8px 0"><b>📌 ${esc(p.name)}</b><div class="muted sm">Proposed by ${esc(nm(p.by))} · ${fmt(p.amt)} every ${p.freq} days · ${p.size} people · pot ${fmt(p.amt*p.size)}</div><div class="tiny muted" style="margin-top:4px">${p.int.length} interested. Interest is not a commitment. Nothing is owed.</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm ${p.int.includes('player')?'':'ghost'}" data-a="g_int2" data-p="${p.id}">${p.int.includes('player')?'Interested ✓':'I want to read the terms'}</button>${p.by==='player'||hand?`<button class="btn sm green" data-a="g_mkajo" data-p="${p.id}">Set up this Ajo</button><button class="btn sm ghost" data-a="g_closep" data-p="${p.id}">Close</button>`:''}</div></div>`).join('')}
 ${!props.length?`<button class="btn ghost sm" data-a="g_ajo">Propose an Ajo to this group</button>`:''}</section>
 ${g.vis==='public'?`<button class="btn ghost" style="margin-top:8px" data-a="g_show">${m.show?'✓ Shown on my profile. Tap to hide':'Show this group on my profile'}</button>`:'<div class="muted tiny" style="margin-top:8px">Private group: it never appears on your profile.</div>'}
 <button class="btn ${UI.gconf==='leave'?'red':'ghost'}" style="margin-top:8px" data-a="g_leave">${UI.gconf==='leave'?'Tap again to leave':'Leave group'}</button>
 <div class="muted tiny" style="margin-top:6px">Leaving a group does not change any Ajo you joined or anything you owe.${succ?' You are the owner: '+esc(nm(succ))+' would take over.':''}</div>`}

function gChat(g,v){const ps=postsFor(g.id)||[],staff=rk(g,'player')>=2,top=ps.filter(p=>!p.parent).slice(-40),rp=ps.find(p=>p.id===UI.gi.replyTo);
 return `${top.length?top.map(p=>gpostHtml(g,p,false,staff)+ps.filter(c=>c.parent===p.id).map(c=>gpostHtml(g,c,true,staff)).join('')).join(''):'<div class="card muted center">No messages yet. Say hello 👋</div>'}
 <div class="composer">${rp?`<div class="row sp tiny muted" style="margin-bottom:4px"><span>Replying to ${esc(nm(rp.by))}</span><button data-a="g_cancelreply" style="background:none;color:var(--danfo);font-weight:800">Cancel</button></div>`:''}${GT('msg','Write a message',280,'','g_send')}<button class="btn sm" style="margin-top:8px" data-a="g_send">Send</button></div>
 <div class="muted tiny" style="margin-top:8px">Be kind. Report anything abusive. Simulated neighbours (NPC) chat here too.</div>`}

function gEvents(g,v){const adm=rk(g,'player')>=3,evs=g.evs.filter(e=>G.day<=e.dl||e.done).sort((a,b)=>(a.day||a.dl)-(b.day||b.dl)),E=UI.ge;
 const card=e=>{const going=e.going.includes('player'),sim=e.going.filter(m=>m!=='player').length;
  if(e.kind==='meetup'){const att=e.att.includes('player');return `<div class="card"><div class="row sp"><b>🗓️ ${esc(e.title)}</b><span class="pill wait">${dayRel(e.day)}</span></div><div class="muted sm">${LOCS[e.loc].ic} ${LOCS[e.loc].n} · ${e.going.length} going (${sim} simulated)</div><div class="row" style="margin-top:8px;flex-wrap:wrap">${att?'<span class="pill ok">You went ✓</span>':going?(e.day===G.day?(G.p.loc===e.loc?`<button class="btn sm green" data-a="g_att" data-e="${e.id}">Join in now (2h)</button>`:`<button class="btn sm" data-a="goto" data-to="${e.loc}">Go there</button>`):'<span class="pill ok">You are going</span>'):`<button class="btn sm" data-a="g_rsvp" data-e="${e.id}" data-y="1">I will come</button>`}${going&&!att&&e.day>=G.day?`<button class="btn sm ghost" data-a="g_rsvp" data-e="${e.id}" data-y="0">Cancel</button>`:''}</div></div>`}
  const t=gTotal(e);return `<div class="card"><div class="row sp"><b>🏆 ${esc(e.title)}</b><span class="pill ${e.done?'ok':'wait'}">${e.done?'Done ✓':'until Day '+e.dl}</span></div><div class="muted sm">Team goal: ${e.target} ${CHL[e.type]} together</div>${bar(Math.min(100,t/e.target*100),'#22c177')}<div class="tiny muted" style="margin-top:4px">${t}/${e.target} · you added ${e.prog.player||0} · other contributions are simulated</div>${!e.done&&!going?`<button class="btn sm" style="margin-top:8px" data-a="g_rsvp" data-e="${e.id}" data-y="1">Join the challenge</button>`:''}</div>`};
 return (evs.length?evs.map(card).join(''):'<div class="card muted center">No activities yet.'+(adm?' Plan a meetup or challenge below.':'')+'</div>')+
 `<div class="muted tiny">Meetups happen in town: be at the place on the day. Challenges count your own work, chats and shop sessions. Everyone else here is simulated.</div>`+
 (adm?`<section class="card"><b>＋ Plan something</b>${GT('etitle','Title, e.g. Friday jollof',40)}<label class="l">Type</label>${GO('ge','kind',['meetup','challenge'],E.kind,v=>v==='meetup'?'🗓️ Meetup':'🏆 Challenge')}
 ${E.kind==='meetup'?`<label class="l">Where</label>${GO('ge','loc',G_LOCS,E.loc,v=>LOCS[v].ic+' '+LOCS[v].n)}<label class="l">When</label>${GO('ge','off',[0,1,2,3,7],E.off,v=>+v===0?'Today':'in '+v+' day'+(+v===1?'':'s'))}`:`<label class="l">Goal</label>${GO('ge','type',['work','talk','shop'],E.type,v=>CHL[v])}<label class="l">Team total</label>${GO('ge','target',[5,10,20],E.target)}<label class="l">Runs for</label>${GO('ge','dur',[3,7,14],E.dur,v=>v+' days')}`}
 <button class="btn" style="margin-top:8px" data-a="g_evmake">Create</button></section>`:'')}

function gPeople(g,v){const L=memberList(g.id);if(!L)return '';if(L.hidden)return `<div class="note">The member list is visible to admins only. ${L.count} members.</div>`;
 const me=rk(g,'player');
 return `<div class="muted tiny" style="margin-bottom:8px">${L.length} members · ${L.filter(x=>x.npc).length} simulated (NPC). No contact details are stored. Blocking hides someone's posts and removes them from groups you own.</div>`+
 L.map(x=>{const blk=G.blk.includes(x.id),r=rk(g,x.id);return `<div class="card" style="margin:0 0 8px"><div class="row sp"><div class="row"><span style="font-size:24px">${avOf(x.id)}</span><div><b>${x.id==='player'?'You':esc(x.name)}</b> ${npcTag(x.id)}<div class="tiny muted">Joined Day ${x.joined}</div></div></div>${rolePill(x.role)}</div>
 ${x.id!=='player'?`<div class="row" style="margin-top:8px;flex-wrap:wrap">${me===4&&x.role!=='owner'?['admin','mod','member'].filter(q=>q!==x.role).map(q=>`<button class="btn sm ghost" data-a="g_role" data-u="${x.id}" data-r="${q}">${q==='admin'?'Make admin':q==='mod'?'Make moderator':'Make member'}</button>`).join(''):''}${me>=3&&r<me?`<button class="btn sm ghost" data-a="g_rm" data-u="${x.id}">Remove</button><button class="btn sm red" data-a="g_ban" data-u="${x.id}">Ban</button>`:''}<button class="btn sm ghost" data-a="${blk?'g_unblock':'g_block'}" data-u="${x.id}">${blk?'Unblock':'Block'}</button></div>`:''}</div>`}).join('')}
